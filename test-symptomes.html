<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page test — symptômes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#080b12;--s1:#0e1220;--s2:#141826;--s3:#1c2235;
  --border:#242a3d;--border2:#2e3650;
  --text:#e8edf8;--muted:#a8b8d8;--dim:#7a8caf;
  --green:#00ffba;--blue:#3db5ff;--purple:#c77dff;--amber:#ff9e2c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}
.page{min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom))}

/* --- barre haute --- */
.top{position:relative;height:40px}
.titre{display:block;text-align:center;line-height:40px;padding:0 44px;font-size:14px;font-weight:500;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aide{position:absolute;left:0;top:2px;width:36px;height:36px;padding:0;cursor:pointer;border-radius:10px;
  border:1px solid rgba(255,158,44,.70);background:linear-gradient(135deg,rgba(255,158,44,.40),rgba(255,158,44,.16));
  color:var(--amber);font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.top-droite{position:absolute;right:0;top:2px;display:flex;gap:4px}
.rond-mini{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--border2);background:var(--s2);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.filet-top{height:2px;border-radius:2px;margin-top:8px;background:linear-gradient(90deg,rgba(255,158,44,.52),rgba(255,158,44,.18))}
.signature{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:9px}
.filet{height:1px;background:rgba(255,255,255,.07);margin:0}

/* --- recherche --- */
.rech{display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,.10);
  padding:16px 0 9px;margin-bottom:2px}
.rech svg{width:15px;height:15px;flex-shrink:0;stroke:var(--dim);fill:none;stroke-width:2;stroke-linecap:round}
.rech input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
  font-family:'Outfit',sans-serif;font-size:13px;padding:0}
.rech input::placeholder{color:var(--dim)}

/* --- selection en cours --- */
.selection{display:flex;align-items:center;gap:8px;padding:12px 0 6px;font-size:11px;color:var(--muted)}
.selection .pt{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.selection b{color:var(--green);font-weight:500}
.selection .hz{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:10.5px}

/* --- categories --- */
.bloc{padding:16px 0 2px}
.grp{width:100%;display:flex;align-items:center;gap:9px;padding:12px;border-radius:10px;border:none;
  cursor:pointer;font-family:'Outfit',sans-serif;margin-bottom:6px;
  background:linear-gradient(90deg,rgba(255,158,44,.10),rgba(255,158,44,.02))}
.grp .nom{font-size:12.5px;font-weight:600;color:var(--amber);text-align:left;flex:1}
.grp .compte{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim)}
.grp .fl{font-size:10px;color:var(--muted);transition:transform .2s}
.contenu{display:none}
.contenu.ouvert{display:block}

/* --- lignes de symptomes : degrade violet, comme le bandeau « Lancer Soir » --- */
.min{width:100%;padding:10px 12px;border-radius:10px;border:none;text-align:left;cursor:pointer;
  font-family:'Outfit',sans-serif;margin-bottom:5px;
  background:linear-gradient(90deg,rgba(199,125,255,.16),rgba(199,125,255,.03))}
.min .haut{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.min .nom{font-size:12.5px;color:var(--text);font-weight:500}
.min .act{font-size:10px;color:var(--muted);margin-top:2px}
.min .droite{display:flex;align-items:center;gap:7px;flex-shrink:0}
.min .plus{width:24px;height:24px;padding:0;border:none;border-radius:50%;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;line-height:1}
.min .plus.m{background:rgba(255,158,44,.16);color:var(--amber)}
.min .plus.s{background:rgba(199,125,255,.18);color:var(--purple)}
.min .plus.joue{background:rgba(0,255,186,.20);color:var(--green)}

/* --- detail : les frequences des deux sequences --- */
.det{display:none;margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08)}
.min.ouvert .det{display:block}
.seq{margin-bottom:7px}
.seq:last-child{margin-bottom:0}
.lab{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.lab.s1{color:var(--amber)}
.lab.s2{color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.chip.s1{background:linear-gradient(90deg,rgba(255,158,44,.16),rgba(255,158,44,.04));color:var(--amber)}
.chip.s2{background:linear-gradient(90deg,rgba(199,125,255,.18),rgba(199,125,255,.05));color:var(--purple)}
.chip i{font-style:normal;color:var(--dim)}

.note{text-align:center;font-size:9.5px;color:var(--muted);opacity:.55;margin-top:20px;line-height:1.5}
.vide{text-align:center;font-size:11px;color:var(--dim);padding:14px 0;display:none}

/* --- nav --- */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);
  display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nv{flex:1;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;
  background:none;border:none;color:var(--amber);font-family:'Outfit',sans-serif;font-size:9.5px;cursor:pointer;position:relative}
.nv.actif{color:var(--green)}
.nv.actif::after{content:'';position:absolute;top:0;left:25%;right:25%;height:2.5px;border-radius:0 0 3px 3px;background:var(--green)}
.nv svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<script>
/* mêmes règles que l'appli : base 9, octave 70-200 Hz */
var OCT_MIN=70,OCT_MAX=200,HZ_DIV_LAVOIE=16;
function sommeChiffres9(v){
  var t=String(v).replace(".","").replace("-","");
  if(!t||/[^0-9]/.test(t))return false;
  var n=0;for(var i=0;i<t.length;i++)n+=t.charCodeAt(i)-48;
  while(n>9){var u=0;while(n>0){u+=n%10;n=Math.floor(n/10);}n=u;}
  return n===9;
}
function octavier(hz){
  if(!(hz>0))return hz;
  var v=hz/HZ_DIV_LAVOIE,k=0;
  while(v>=OCT_MAX&&k<40){v=v/2;k++;}
  while(v<OCT_MIN&&k>-40){v=v*2;k--;}
  return v;
}
function base9Affiche(hz){
  var pas=[0.0001,0.001,0.01,0.1];
  for(var p=0;p<pas.length;p++){
    var st=pas[p],n0=Math.round(hz/st);
    for(var k=0;k<=20;k++){
      var c=[n0,n0+k,n0-k];
      for(var i=0;i<3;i++){
        var v=parseFloat((c[i]*st).toFixed(4));
        if(v>0&&sommeChiffres9(v))return v;
      }
    }
  }
  return parseFloat(hz.toFixed(4));
}
function hzSortie(hz){return hz?base9Affiche(octavier(hz)):hz;}
function hzAff(hz){return hz>0?Math.round(hzSortie(hz)*100)/100:hz;}
function fr(x,d){var s=(parseFloat(x)||0).toFixed(d===undefined?2:d);
  if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\.$/,'');}return s.replace('.',',');}
function duree(liste){var t=0;(liste||[]).forEach(function(f){t+=f.d||0;});return t;}

    if(it.s1.length)boutons+='<button class="plus m" data-seq="s1" aria-label="Lancer S1">1</button>';
    if(it.s2.length)boutons+='<button class="plus s" data-seq="s2" aria-label="Lancer S2">2</button>';
    b.innerHTML='<div class="haut"><div><div class="nom">'+it.n+'</div><div class="act">'+sous.join(' · ')+'</div></div>'
      +'<div class="droite">'+boutons+'</div></div>'
      +(det?'<div class="det">'+det+'</div>':'');
    b.onclick=function(){
      var ouvert=b.classList.toggle('ouvert');
      if(ouvert){
        var sel=document.getElementById('selection');
        sel.style.display='flex';
        document.getElementById('sel-nom').textContent=it.n;
        var t=[];
        if(it.s1.length)t.push('S1 '+duree(it.s1)+' min');
        if(it.s2.length)t.push('S2 '+duree(it.s2)+' min');
        document.getElementById('sel-hz').textContent='· '+t.join(' · ');
      }
    };
    Array.prototype.forEach.call(b.querySelectorAll('.plus'),function(p){
      p.onclick=function(e){
        e.stopPropagation();
        Array.prototype.forEach.call(b.querySelectorAll('.plus'),function(q){
          if(q!==p){q.classList.remove('joue');q.textContent=q.getAttribute('data-seq')==='s1'?'1':'2';}
        });
        var etait=p.classList.contains('joue');
        p.classList.toggle('joue',!etait);
        p.textContent=etait?(p.getAttribute('data-seq')==='s1'?'1':'2'):'✓';
        if(!etait){
          var sel=document.getElementById('selection');
          sel.style.display='flex';
          document.getElementById('sel-nom').textContent=it.n;
          var seq=p.getAttribute('data-seq')==='s1'?it.s1:it.s2;
          document.getElementById('sel-hz').textContent='· '+(p.getAttribute('data-seq')==='s1'?'S1 — Nettoyage':'S2 — Réparation')+' · '+duree(seq)+' min';
        }
      };
    });
    b.querySelectorAll('.plus').length||(b.querySelector('.droite').style.display='none');
    box.appendChild(b);
    toutes.push({row:b,box:box,grp:g,cat:cat});
  });
  g.onclick=function(){
    var ouvert=box.classList.toggle('ouvert');
    g.querySelector('.fl').textContent=ouvert?'▼':'▶';
  };
  z.appendChild(g);
  z.appendChild(box);
});

/* recherche : filtre les lignes, ouvre les catégories qui contiennent un résultat */
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
document.getElementById('rech').addEventListener('input',function(){
  var t=norm(this.value);
  var restants=0;
  CATS.forEach(function(cat){
    var groupe=toutes.filter(function(x){return x.cat===cat;});
    if(!groupe.length)return;
    var n=0;
    groupe.forEach(function(o){
      var ok=!t||norm(o.row.getAttribute('data-nom')).indexOf(t)>=0;
      o.row.style.display=ok?'':'none';
      if(ok)n++;
    });
    restants+=n;
    if(t){
      var ouvert=n>0;
      groupe[0].grp.style.display=ouvert?'':'none';
      groupe[0].box.classList.toggle('ouvert',ouvert);
      groupe[0].grp.querySelector('.fl').textContent=ouvert?'▼':'▶';
    } else {
      groupe[0].grp.style.display='';
      groupe[0].box.classList.add('ouvert');
      groupe[0].grp.querySelector('.fl').textContent='▼';
    }
  });
  document.getElementById('vide').style.display=(t&&restants===0)?'block':'none';
});
</script>
