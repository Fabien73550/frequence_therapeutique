<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page test — lecteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--s1:#0e1220;--s2:#141826;--s3:#1c2235;
  --border:#242a3d;--border2:#2e3650;
  --text:#e8edf8;--muted:#a8b8d8;--dim:#7a8caf;
  --green:#00ffba;--blue:#3db5ff;--purple:#c77dff;--amber:#ff9e2c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}
.page{min-height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 20px calc(14px + env(safe-area-inset-bottom))}

/* --- barre haute : retour bien visible --- */
.top{display:flex;align-items:center;justify-content:space-between;height:36px}
.back{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,158,44,.55);
      background:linear-gradient(135deg,rgba(255,158,44,.40),rgba(255,158,44,.16));border-color:rgba(255,158,44,.70);color:var(--amber);
      display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.back:active{transform:scale(.96);background:rgba(255,158,44,.32)}
.essai{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}

/* --- bloc central --- */
.centre{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 0 0}
.hz{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:38px;line-height:1;letter-spacing:-1px;color:var(--text);margin-top:26px}
.hz small{font-size:14px;color:var(--dim);margin-left:6px;letter-spacing:0;font-weight:400}
.etape{font-size:12px;font-weight:400;color:var(--text)}
.etape b{color:var(--green);font-weight:500}
.compteur{margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);opacity:.8;letter-spacing:.5px}
.barre{width:100%;height:4px;border-radius:4px;background:var(--s3);overflow:hidden;margin-top:16px}
.barre > i{display:block;height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,var(--green),var(--amber));transition:width .4s linear}

/* --- liste des etapes qui arrivent --- */
.liste{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:1px;
       border-radius:12px;overflow:hidden;background:rgba(255,255,255,.04)}
.et{display:flex;align-items:center;gap:11px;padding:12px 13px;border:none;
    background:transparent;text-align:left;cursor:pointer;border-left:2px solid transparent}
.et .num{width:21px;height:21px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
         font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);border:1px solid rgba(255,158,44,.45)}
.et .nom{flex:1;min-width:0;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.et .meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);opacity:.75;flex-shrink:0}
.et.actif{border-left-color:var(--green);background:rgba(0,255,186,.07)}
.et.actif .num{color:#04120e;background:var(--green);border-color:var(--green);font-weight:500}
.et.actif .nom{color:var(--text);font-weight:500;opacity:1}
.et.actif .meta{color:var(--green);opacity:1}

/* --- bas : volume + commandes --- */
.bas{margin-top:14px}
.vol{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.vol label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:52px}
.vol output{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-width:38px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
  background:linear-gradient(90deg,var(--green),var(--amber))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;margin-top:-6.5px;box-shadow:0 0 10px rgba(255,255,255,.4)}

.commandes{display:flex;align-items:center;justify-content:center;gap:24px}
.rond{width:46px;height:46px;border-radius:50%;border:1px solid var(--border2);background:var(--s2);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.rond:active{transform:scale(.95)}
.principal{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;color:#04120e;
  background:linear-gradient(135deg,var(--green),var(--amber));font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(0,255,186,.16)}
.principal:active{transform:scale(.97)}
.legende{margin-top:14px;text-align:center;font-size:9.5px;color:var(--muted);opacity:.55;line-height:1.5}
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <button class="back" aria-label="Retour" onclick="history.length>1?history.back():0">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="essai">page de test</span>
  </div>

  <div class="centre">
    <div class="etape" id="etape">—</div>
    <div class="compteur" id="compteur">00:00 / 10:00</div>
    <div class="hz" id="hz">—<small>Hz</small></div>
    <div class="barre"><i id="prog"></i></div>
    <div class="liste" id="liste"></div>
  </div>

  <div class="bas">
    <div class="vol">
      <label for="v">Volume</label>
      <input type="range" id="v" min="0" max="100" value="50">
      <output id="vo">50 %</output>
    </div>

    <div class="commandes">
      <button class="rond" id="prev" aria-label="Étape précédente">⏮</button>
      <button class="principal" id="play" aria-label="Écouter">▶</button>
      <button class="rond" id="next" aria-label="Étape suivante">⏭</button>
    </div>

    <div class="legende">
      Fréquence réelle jouée · étape en cours sur le total · temps écoulé<br>
      Page de test — rien n'est publié dans l'application
    </div>
  </div>
</div>

<script>
/* --- mêmes regles que l'appli : 70-200 Hz, base 9 --- */
var OCT_MIN=70,OCT_MAX=200,HZ_DIV_LAVOIE=16;
function sommeChiffres9(v){
  var t=String(v).replace(".","").replace("-","");
  if(!t||/[^0-9]/.test(t))return false;
  var n=0;for(var i=0;i<t.length;i++)n+=t.charCodeAt(i)-48;
  while(n>9){var u=0;while(n>0){u+=n%10;n=Math.floor(n/10);}n=u;}
  return n===9;
}
function octavier(hz){
  if(!(hz>0))return hz;
  var v=hz/HZ_DIV_LAVOIE,k=0;
  while(v>=OCT_MAX&&k<40){v=v/2;k++;}
  while(v<OCT_MIN&&k>-40){v=v*2;k--;}
  return v;
}
function base9Affiche(hz){
  var pas=[0.0001,0.001,0.01,0.1];
  for(var p=0;p<pas.length;p++){
    var st=pas[p],n0=Math.round(hz/st);
    for(var k=0;k<=20;k++){
      var c=[n0,n0+k,n0-k];
      for(var i=0;i<3;i++){
        var v=parseFloat((c[i]*st).toFixed(4));
        if(v>0&&sommeChiffres9(v))return v;
      }
    }
  }
  return parseFloat(hz.toFixed(4));
}
function hzSortie(hz){return hz?base9Affiche(octavier(hz)):hz;}
function hzAff(hz){return hz>0?Math.round(hzSortie(hz)*100)/100:hz;}

/* --- un vrai protocole de l appli : Anti-stress biochimique (5 etapes) --- */
var STEPS=[
  {n:"Lithium",   hz:331.062012, d:10},
  {n:"Magnesium", hz:1159.232148,d:10},
  {n:"GABA",      hz:307.350236, d:10},
  {n:"Serotonine",hz:525.210944, d:10},
  {n:"Helium",    hz:190.904958, d:10}
];
var PROTO="Anti-stress biochimique";
var i=0, joue=false, ecoule=0, tic=null;

var $hz=document.getElementById('hz'), $et=document.getElementById('etape'),
    $cp=document.getElementById('compteur'), $pr=document.getElementById('prog'),
    $play=document.getElementById('play');

function mmss(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function dessine(){
  var s=STEPS[i], total=s.d*60;
  $hz.innerHTML=hzAff(s.hz).toFixed(2).replace('.',',')+'<small>Hz</small>';
  $et.innerHTML='<b>'+(i+1)+'/'+STEPS.length+'</b> · '+PROTO+' — '+s.n;
  $cp.textContent=mmss(ecoule)+' / '+mmss(total);
  $pr.style.width=(ecoule/total*100).toFixed(1)+'%';
  var html='';
  for(var k=0;k<STEPS.length;k++){
    var e=STEPS[k];
    html+='<button class="et'+(k===i?' actif':'')+'" onclick="aller('+k+')">'
        + '<span class="num">'+(k+1)+'</span>'
        + '<span class="nom">'+e.n+'</span>'
        + '<span class="meta">'+hzAff(e.hz).toFixed(2).replace('.',',')+' Hz · '+e.d+' min</span>'
        + '</button>';
  }
  document.getElementById('liste').innerHTML=html;
}
function aller(k){i=k;ecoule=0;dessine();}
function tick(){
  if(!joue)return;
  ecoule++;
  if(ecoule>=STEPS[i].d*60){
    if(i<STEPS.length-1){i++;ecoule=0;}
    else{stop();ecoule=STEPS[i].d*60;dessine();return;}
  }
  dessine();
}
function start(){joue=true;$play.textContent='⏸';clearInterval(tic);tic=setInterval(tick,1000);}
function stop(){joue=false;$play.textContent='▶';clearInterval(tic);}
$play.onclick=function(){joue?stop():start();};
document.getElementById('next').onclick=function(){i=(i+1)%STEPS.length;ecoule=0;dessine();};
document.getElementById('prev').onclick=function(){i=(i-1+STEPS.length)%STEPS.length;ecoule=0;dessine();};
var $v=document.getElementById('v'),$vo=document.getElementById('vo');
$v.oninput=function(){$vo.textContent=$v.value+' %';};
dessine();
</script>
</body>
</html>
