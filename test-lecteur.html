<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page test — lecteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--s1:#0e1220;--s2:#141826;--s3:#1c2235;
  --border:#242a3d;--border2:#2e3650;
  --text:#e8edf8;--muted:#a8b8d8;--dim:#7a8caf;
  --green:#00ffba;--blue:#3db5ff;--purple:#c77dff;--amber:#ff9e2c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}
.page{min-height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}

/* --- barre haute : juste le retour --- */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--s2);
      color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.back:active{transform:scale(.96)}
.essai{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* --- bloc central : Hertz, etape, compteur --- */
.centre{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.hz{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:74px;line-height:1;letter-spacing:-2px;color:var(--text)}
.hz small{font-size:26px;color:var(--dim);margin-left:7px;letter-spacing:0}
.etape{font-size:16px;font-weight:500;color:var(--text)}
.etape b{color:var(--green);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:15px}
.compteur{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--dim);letter-spacing:.5px}
.barre{width:100%;height:5px;border-radius:5px;background:var(--s3);overflow:hidden;margin-top:22px}
.barre > i{display:block;height:100%;width:0%;border-radius:5px;
  background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .4s linear}

/* --- volume --- */
.vol{display:flex;align-items:center;gap:12px;margin:26px 0 6px}
.vol label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);min-width:58px}
.vol output{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);min-width:42px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;
  background:linear-gradient(90deg,var(--blue),var(--purple))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;margin-top:-7px;box-shadow:0 0 12px rgba(255,255,255,.45)}

/* --- commandes --- */
.commandes{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.rond{width:56px;height:56px;border-radius:50%;border:1px solid var(--border2);background:var(--s2);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.rond:active{transform:scale(.95)}
.principal{width:86px;height:86px;border-radius:50%;border:none;cursor:pointer;color:#04120e;
  background:linear-gradient(135deg,var(--green),var(--blue));font-size:30px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,255,186,.18)}
.principal:active{transform:scale(.97)}
.legende{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);opacity:.65;line-height:1.55}
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <button class="back" aria-label="Retour" onclick="history.length>1?history.back():0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="essai">page de test</span>
  </div>

  <div class="centre">
    <div class="hz" id="hz">—<small>Hz</small></div>
    <div class="etape" id="etape">—</div>
    <div class="compteur" id="compteur">00:00</div>
    <div class="barre"><i id="prog"></i></div>
  </div>

  <div class="vol">
    <label for="v">Volume</label>
    <input type="range" id="v" min="0" max="100" value="50">
    <output id="vo">50 %</output>
  </div>

  <div class="commandes">
    <button class="rond" id="prev" aria-label="Étape précédente">⏮</button>
    <button class="principal" id="play" aria-label="Écouter">▶</button>
    <button class="rond" id="next" aria-label="Étape suivante">⏭</button>
  </div>

  <div class="legende">
    Fréquence réelle jouée · étape en cours sur le total · temps restant<br>
    Page de test — rien n'est publié dans l'application
  </div>
</div>

<script>
/* --- mêmes regles que l'appli : 70-200 Hz, base 9 --- */
var OCT_MIN=70,OCT_MAX=200,HZ_DIV_LAVOIE=16;
function sommeChiffres9(v){
  var t=String(v).replace(".","").replace("-","");
  if(!t||/[^0-9]/.test(t))return false;
  var n=0;for(var i=0;i<t.length;i++)n+=t.charCodeAt(i)-48;
  while(n>9){var u=0;while(n>0){u+=n%10;n=Math.floor(n/10);}n=u;}
  return n===9;
}
function octavier(hz){
  if(!(hz>0))return hz;
  var v=hz/HZ_DIV_LAVOIE,k=0;
  while(v>=OCT_MAX&&k<40){v=v/2;k++;}
  while(v<OCT_MIN&&k>-40){v=v*2;k--;}
  return v;
}
function base9Affiche(hz){
  var pas=[0.0001,0.001,0.01,0.1];
  for(var p=0;p<pas.length;p++){
    var st=pas[p],n0=Math.round(hz/st);
    for(var k=0;k<=20;k++){
      var c=[n0,n0+k,n0-k];
      for(var i=0;i<3;i++){
        var v=parseFloat((c[i]*st).toFixed(4));
        if(v>0&&sommeChiffres9(v))return v;
      }
    }
  }
  return parseFloat(hz.toFixed(4));
}
function hzSortie(hz){return hz?base9Affiche(octavier(hz)):hz;}
function hzAff(hz){return hz>0?Math.round(hzSortie(hz)*100)/100:hz;}

/* --- un vrai protocole de l appli : Anti-stress biochimique (5 etapes) --- */
var STEPS=[
  {n:"Lithium",   hz:331.062012, d:10},
  {n:"Magnesium", hz:1159.232148,d:10},
  {n:"GABA",      hz:307.350236, d:10},
  {n:"Serotonine",hz:525.210944, d:10},
  {n:"Helium",    hz:190.904958, d:10}
];
var PROTO="Anti-stress biochimique";
var i=0, joue=false, reste=STEPS[0].d*60, tic=null;

var $hz=document.getElementById('hz'), $et=document.getElementById('etape'),
    $cp=document.getElementById('compteur'), $pr=document.getElementById('prog'),
    $play=document.getElementById('play');

function mmss(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function dessine(){
  var s=STEPS[i];
  $hz.innerHTML=hzAff(s.hz).toFixed(2).replace('.',',')+'<small>Hz</small>';
  $et.innerHTML=(i+1)+'/'+STEPS.length+' · <b>'+PROTO+'</b> — '+s.n;
  $cp.textContent=mmss(reste)+' / '+mmss(s.d*60);
  var total=s.d*60;
  $pr.style.width=((total-reste)/total*100).toFixed(1)+'%';
}
function tick(){
  if(!joue)return;
  reste--;
  if(reste<=0){
    if(i<STEPS.length-1){i++;reste=STEPS[i].d*60;}
    else{stop();reste=0;dessine();return;}
  }
  dessine();
}
function start(){joue=true;$play.textContent='⏸';clearInterval(tic);tic=setInterval(tick,1000);}
function stop(){joue=false;$play.textContent='▶';clearInterval(tic);}
$play.onclick=function(){joue?stop():start();};
document.getElementById('next').onclick=function(){
  i=(i+1)%STEPS.length;reste=STEPS[i].d*60;dessine();
};
document.getElementById('prev').onclick=function(){
  i=(i-1+STEPS.length)%STEPS.length;reste=STEPS[i].d*60;dessine();
};
var $v=document.getElementById('v'),$vo=document.getElementById('vo');
$v.oninput=function(){$vo.textContent=$v.value+' %';};
dessine();
</script>
</body>
</html>
