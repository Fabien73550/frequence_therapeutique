<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page test — perso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--s1:#0e1220;--s2:#141826;--s3:#1c2235;
  --border:#242a3d;--border2:#2e3650;
  --text:#e8edf8;--muted:#a8b8d8;--dim:#7a8caf;
  --green:#00ffba;--blue:#3db5ff;--purple:#c77dff;--amber:#ff9e2c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;overflow-x:hidden}
.page{min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom))}

/* --- barre haute --- */
.top{position:relative;height:40px}
.titre{display:block;text-align:center;line-height:40px;padding:0 44px;font-size:14px;font-weight:500;
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aide{position:absolute;left:0;top:2px;width:36px;height:36px;padding:0;cursor:pointer;border-radius:10px;
  border:1px solid rgba(255,158,44,.70);background:linear-gradient(135deg,rgba(255,158,44,.40),rgba(255,158,44,.16));
  color:var(--amber);font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.top-droite{position:absolute;right:0;top:2px;display:flex;gap:4px}
.rond-mini{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid var(--border2);background:var(--s2);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.filet-top{height:2px;border-radius:2px;margin-top:8px;background:linear-gradient(90deg,rgba(255,158,44,.52),rgba(255,158,44,.18))}
.signature{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:9px}
.filet{height:1px;background:rgba(255,255,255,.07);margin:0}

/* --- blocs --- */
.bloc{padding:18px 0 4px}
.label-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.compte{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);letter-spacing:.02em}
.droite{display:flex;align-items:baseline;gap:12px}
.vider{background:none;border:none;color:var(--dim);font-family:'Outfit',sans-serif;font-size:11px;cursor:pointer;
  padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.vider:active{color:var(--muted)}

/* --- lignes d'une playlist --- */
.liste{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:9px;width:100%;
  padding:11px 12px;border-radius:10px;border:none;text-align:left;font-family:'Outfit',sans-serif}
.item .nom{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--blue)}
.item .duree{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);opacity:.8;margin-right:auto}
.item .sup,.sauve .sup{width:22px;height:22px;padding:0;border:none;border-radius:50%;background:rgba(255,255,255,.05);
  color:var(--dim);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.item .sup:active,.sauve .sup:active{background:rgba(255,255,255,.10);color:var(--text)}
/* matin : fond ambré très léger / soir : fond violet très léger */
.liste.matin .item{background:linear-gradient(90deg,rgba(255,158,44,.10),rgba(255,158,44,.02))}
.liste.soir .item{background:linear-gradient(90deg,rgba(199,125,255,.11),rgba(199,125,255,.02))}
.vide{padding:14px 12px;border-radius:10px;border:1px dashed rgba(255,255,255,.10);
  font-size:11.5px;color:var(--dim);text-align:center}

/* --- bandeau d'action de chaque playlist --- */
.bandeau{display:block;width:100%;padding:13px 12px;border:none;border-radius:10px;cursor:pointer;
  font-family:'Outfit',sans-serif;font-size:13.5px;font-weight:600;text-align:center;margin-top:12px}
.bandeau.matin{background:linear-gradient(90deg,rgba(255,158,44,.20),rgba(255,158,44,.06));color:var(--amber)}
.bandeau.soir{background:linear-gradient(90deg,rgba(199,125,255,.22),rgba(199,125,255,.06));color:var(--purple)}
.bandeau.joue{background:linear-gradient(90deg,rgba(0,255,186,.20),rgba(0,255,186,.06));color:var(--green)}
.bandeau:active{transform:scale(.985)}

/* --- enregistrer --- */
.enreg{display:flex;align-items:center;gap:8px;margin-top:10px;border-bottom:1px solid rgba(255,255,255,.10);padding-bottom:6px}
.enreg input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
  font-family:'Outfit',sans-serif;font-size:12.5px;padding:4px 0}
.enreg input::placeholder{color:var(--dim)}
.enreg button{background:none;border:none;color:var(--green);font-family:'Outfit',sans-serif;font-size:12px;
  font-weight:600;cursor:pointer;padding:4px 6px;white-space:nowrap}

/* --- playlists sauvegardées + protocoles suggérés --- */
.sauve{display:grid;grid-template-columns:1fr 22px;align-items:center;gap:10px;width:100%;padding:12px;
  border-radius:10px;border:none;text-align:left;background:linear-gradient(90deg,rgba(0,255,186,.06),rgba(255,158,44,.03));
  font-family:'Outfit',sans-serif;cursor:pointer}
.sauve .nom{font-size:13px;color:var(--text);font-weight:500}
.sauve .sous{font-size:10.5px;color:var(--muted);margin-top:3px}
.grp{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;
  border-radius:10px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;
  background:linear-gradient(90deg,rgba(255,158,44,.10),rgba(255,158,44,.02));margin-bottom:6px}
.grp.soir{background:linear-gradient(90deg,rgba(199,125,255,.11),rgba(199,125,255,.02))}
.grp .nom{font-size:13px;font-weight:600;color:var(--amber)}
.grp.soir .nom{color:var(--purple)}
.grp .fl{font-size:11px;color:var(--muted);transition:transform .2s}
.contenu{display:none;padding:2px 0 8px}
.contenu.ouvert{display:block}
.proto{padding:12px;border-radius:10px;background:rgba(255,255,255,.025);margin-bottom:6px}
.proto .haut{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.proto .pt{font-size:12.5px;font-weight:500;color:var(--text)}
.proto .bouton{background:none;border:none;color:var(--amber);font-family:'Outfit',sans-serif;font-size:11px;
  font-weight:600;cursor:pointer;padding:3px 6px;white-space:nowrap}
.proto.soir .bouton{color:var(--purple)}
.proto .desc{font-size:10.5px;color:var(--muted);line-height:1.45;margin-bottom:7px}
.proto .chips{display:flex;flex-wrap:wrap;gap:5px}
.proto .chip{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--dim);padding:3px 7px;
  border-radius:6px;background:var(--s2);border:1px solid var(--border)}

/* --- nav --- */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--border);
  display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nv{flex:1;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--amber);font-family:'Outfit',sans-serif;font-size:9.5px;cursor:pointer;position:relative}
.nv.actif{color:var(--green)}
.nv.actif::after{content:'';position:absolute;top:0;left:25%;right:25%;height:2.5px;border-radius:0 0 3px 3px;background:var(--green)}
.nv{text-decoration:none}
.nv svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.note{text-align:center;font-size:9.5px;color:var(--muted);opacity:.55;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <button class="aide" aria-label="Aide">?</button>
    <span class="titre">Mes Playlists</span>
    <div class="top-droite">
      <button class="rond-mini" aria-label="Volume">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="rond-mini" aria-label="Thème">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="filet-top"></div>
  <div class="signature">Matin et Soir · Ajoute depuis Minéraux</div>

  <!-- ===== MATIN ===== -->
  <section class="bloc">
    <div class="label-row">
      <span class="label">Playlist Matin</span>
      <span class="droite">
        <span class="compte" id="compte-matin">0 fréquence</span>
        <button class="vider" data-vider="matin">Vider</button>
      </span>
    </div>
    <div class="liste matin" id="liste-matin"></div>
    <button class="bandeau matin" id="lancer-matin">▶ Lancer Matin</button>
    <div class="enreg">
      <input type="text" id="nom-matin" placeholder="Nom de la playlist…">
      <button>💾 Sauver</button>
    </div>
  </section>

  <div class="filet"></div>

  <!-- ===== SOIR ===== -->
  <section class="bloc">
    <div class="label-row">
      <span class="label">Playlist Soir</span>
      <span class="droite">
        <span class="compte" id="compte-soir">0 fréquence</span>
        <button class="vider" data-vider="soir">Vider</button>
      </span>
    </div>
    <div class="liste soir" id="liste-soir"></div>
    <button class="bandeau soir" id="lancer-soir">▶ Lancer Soir</button>
    <div class="enreg">
      <input type="text" id="nom-soir" placeholder="Nom de la playlist…">
      <button>💾 Sauver</button>
    </div>
  </section>

  <div class="filet"></div>

  <!-- ===== SAUVEGARDEES ===== -->
  <section class="bloc">
    <div class="label-row"><span class="label">Mes playlists sauvegardées</span></div>
    <div class="liste" id="liste-sauve"></div>
  </section>

  <div class="note">Page de test — rien n'est publié dans l'application</div>
</div>

<nav class="nav">
  <a class="nv" href="index.html" aria-label="Binaural">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>Binaural
  </a>
  <span class="nv actif" aria-label="Perso">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Perso
  </span>
  <a class="nv" href="test-mineraux.html" aria-label="Minéraux">
    <svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9z"/><path d="M11 3 8 9l4 13 4-13-3-6"/></svg>Minéraux
  </a>
  <a class="nv" href="index.html" aria-label="Symptômes">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 7v8M7 11h8"/></svg>Symptômes
  </a>
  <a class="nv" href="index.html" aria-label="Favoris">
    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Favoris
  </a>
  <a class="nv" href="index.html" aria-label="Plus">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>Plus
  </a>
</nav>

<script>
/* --- playlists du moment : remplies depuis Minéraux, gardées sur l'appareil --- */
var CLE_MATIN='ft_slot_matin';
var CLE_SOIR='ft_slot_soir';
function chargeSlot(slot){
  try{
    var t=localStorage.getItem(slot==='matin'?CLE_MATIN:CLE_SOIR);
    if(!t){return [];}
    var a=JSON.parse(t);
    if(!Array.isArray(a)){return [];}
    return a.filter(function(x){return x&&x.nom;});
  }catch(e){return [];}
}
function gardeSlot(slot){
  try{localStorage.setItem(slot==='matin'?CLE_MATIN:CLE_SOIR,JSON.stringify(slot==='matin'?MATIN:SOIR));}catch(e){}
}
var MATIN=chargeSlot('matin');
var SOIR=chargeSlot('soir');

/* --- playlists sauvegardées : gardées en mémoire sur l'appareil --- */
var CLE_SAUVE='ft_sauve_v1';
function echap(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function chargeSauve(){
  try{
    var t=localStorage.getItem(CLE_SAUVE);
    if(!t){return [];}
    var a=JSON.parse(t);
    if(!Array.isArray(a)){return [];}
    return a.filter(function(p){return p && p.nom && Array.isArray(p.items) && p.items.length;});
  }catch(e){return [];}
}
function gardeSauve(){
  try{localStorage.setItem(CLE_SAUVE,JSON.stringify(SAUVE));}catch(e){}
}
var SAUVE=chargeSauve();

function fr(x,d){var s=(parseFloat(x)||0).toFixed(d===undefined?2:d);
  if(s.indexOf('.')>=0){s=s.replace(/0+$/,'').replace(/\.$/,'');}return s.replace('.',',');}

function dessineListe(idListe,idCompte,items,tag){
  var el=document.getElementById(idListe);
  el.innerHTML='';
  if(items.length===0){
    el.innerHTML='<div class="vide">Vide — ajoute des fréquences depuis Minéraux</div>';
  }else{
    items.forEach(function(it,i){
      var b=document.createElement('div');b.className='item';
      b.innerHTML='<span class="nom">'+it.nom+'</span><span class="duree">'+fr(it.hz,2)+' Hz · '+it.d+' min</span>'
                 +'<button class="sup" aria-label="Retirer">✕</button>';
      b.querySelector('.sup').onclick=function(){items.splice(i,1);gardeSlot(tag);dessineListe(idListe,idCompte,items,tag);};
      el.appendChild(b);
    });
  }
  document.getElementById(idCompte).textContent=items.length+(items.length>1?' fréquences':' fréquence');
}

function dessineSauve(){
  var el=document.getElementById('liste-sauve');
  el.innerHTML='';
  if(SAUVE.length===0){el.innerHTML='<div class="vide">Aucune playlist sauvegardée.</div>';return;}
  SAUVE.forEach(function(p,i){
    var b=document.createElement('div');b.className='sauve';
    b.innerHTML='<div><div class="nom">'+echap(p.nom)+'</div><div class="sous">'+p.items.length+(p.items.length>1?' fréquences':' fréquence')+'</div></div>'
               +'<button class="sup" aria-label="Supprimer">✕</button>';
    b.querySelector('.sup').onclick=function(e){e.stopPropagation();SAUVE.splice(i,1);gardeSauve();dessineSauve();};
    el.appendChild(b);
  });
}

['matin','soir'].forEach(function(slot){
  var btn=document.getElementById('lancer-'+slot);
  btn.onclick=function(){
    var joue=btn.classList.contains('joue');
    document.querySelectorAll('.bandeau').forEach(function(x){x.classList.remove('joue');x.textContent='▶ Lancer '+(x.id==='lancer-matin'?'Matin':'Soir');});
    if(!joue){btn.classList.add('joue');btn.textContent='⏸ Écoute en cours';}
  };
});

[['matin','nom-matin'],['soir','nom-soir']].forEach(function(paire){
  var slot=paire[0];
  var inp=document.getElementById(paire[1]);
  var btn=inp.parentNode.querySelector('button');
  btn.onclick=function(){
    var nom=(inp.value||'').trim();
    var items=(slot==='matin')?MATIN:SOIR;
    if(!nom||items.length===0){inp.focus();return;}
    SAUVE.push({nom:nom,items:items.map(function(x){return {nom:x.nom,hz:x.hz,d:x.d};})});
    gardeSauve();
    inp.value='';
    inp.blur();
    dessineSauve();
  };
});

document.querySelectorAll('.vider').forEach(function(b){
  b.onclick=function(){
    var slot=b.dataset.vider;
    var items=(slot==='matin')?MATIN:SOIR;
    items.length=0;
    gardeSlot(slot);
    dessineListe('liste-'+slot,'compte-'+slot,items,slot);
    var lancer=document.getElementById('lancer-'+slot);
    lancer.classList.remove('joue');
    lancer.textContent='▶ Lancer '+(slot==='matin'?'Matin':'Soir');
  };
});

dessineListe('liste-matin','compte-matin',MATIN,'matin');
dessineListe('liste-soir','compte-soir',SOIR,'soir');
dessineSauve();
</script>
</body>
</html>
